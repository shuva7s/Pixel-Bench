[package]
name = "avif-encoder"
version = "0.1.0"
description = "AVIF encoding (rav1e via ravif) for Pixel Bench."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravif = { version = "0.13", default-features = false }
rgb = "0.8"

[features]
# Native builds: encode tiles on several threads.
native = ["ravif/threading"]
# Hand-written assembly in rav1e (needs nasm on x86-64).
asm = ["ravif/asm"]
