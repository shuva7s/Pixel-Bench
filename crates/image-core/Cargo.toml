[package]
name = "image-core"
version = "0.1.0"
description = "Image decoding, transformation and encoding core for the image tools web app."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
kamadak-exif = "0.6.1"
crc32fast = "1"
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tiff = { version = "0.11", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
