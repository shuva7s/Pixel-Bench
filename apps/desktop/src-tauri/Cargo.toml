[package]
name = "pixel-bench"
version = "0.1.0"
description = "Pixel Bench: private photo editor, converter and background remover."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pixel_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
app-core = { path = "../../../crates/app-core" }
ai = { path = "../../../crates/ai" }
image-core = { workspace = true, features = ["parallel"] }
image = { version = "0.25.10", default-features = false }
serde.workspace = true
serde_json.workspace = true
