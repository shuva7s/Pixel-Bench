[workspace]
resolver = "3"
members = ["crates/image-core", "crates/avif-encoder", "crates/app-core", "crates/ai", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
image-core = { path = "crates/image-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Panics unwind (the default), so a failure in one image job is reported as
# an error instead of closing the app.
strip = true
