[workspace]
resolver = "3"
members = ["crates/image-core", "crates/avif-encoder", "packages/image-engine-wasm", "packages/image-engine-wasm/avif"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
image-core = { path = "crates/image-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
