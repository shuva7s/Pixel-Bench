# Continuous integration for day-to-day work.
# - Every push to `develop` runs the full test suite.
# - Every pull request into `main` also builds the installers for Windows,
#   macOS and Linux (as downloadable artifacts), so nothing that fails to
#   build can be merged. Merging into `main` then publishes a release
#   (see release.yml).
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # The prebuilt ONNX Runtime targets macOS 13.4 (ignored elsewhere).
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v5
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev nasm
      - name: NASM (AVIF encoder assembly)
        if: runner.os != 'Linux'
        uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage DirectML.dll (Windows)
        # ONNX Runtime's DirectML.dll lands in target/release while the AI crate
        # builds. Tauri copies bundled files into that same folder, so the
        # installer takes the DLL from a separate copy instead.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p ai
          dll=$(find target/release -maxdepth 2 -iname DirectML.dll | head -n 1)
          test -n "$dll" || { echo "DirectML.dll not found under target/release"; exit 1; }
          mkdir -p apps/desktop/src-tauri/dlls
          cp "$dll" apps/desktop/src-tauri/dlls/DirectML.dll
      - name: Build the app and installers
        working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-bench-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
